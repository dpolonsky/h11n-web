<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages 404.html fallback for SPA routing
        // This ensures that any direct URL access works
        // Uses relative paths for static hosting compatibility
        (function() {
            const path = window.location.pathname;
            const hash = window.location.hash;
            const basePath = path.substring(0, path.lastIndexOf('/') + 1);
            
            // If there's a hash, redirect to index with hash
            if (hash) {
                window.location.replace(basePath + 'index.html' + hash);
            } else {
                // Otherwise redirect to index.html (relative path)
                window.location.replace(basePath + 'index.html');
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
